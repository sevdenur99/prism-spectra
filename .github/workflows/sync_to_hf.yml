name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install huggingface_hub
        run: pip install --upgrade huggingface_hub

      - name: Upload to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          import os
          from huggingface_hub import HfApi

          token = os.environ.get('HF_TOKEN')
          if not token:
              raise SystemExit('::error::HF_TOKEN secret is empty!')

          api = HfApi(token=token)
          repo_id = 'sevden123/prism-spectra'

          files_to_sync = ['app.py', 'requirements.txt']
          for f in files_to_sync:
              if os.path.exists(f):
                  print(f'Uploading {f} to {repo_id}...')
                  api.upload_file(
                      path_or_fileobj=f,
                      path_in_repo=f,
                      repo_id=repo_id,
                      repo_type='space',
                      commit_message=f'ci: sync {f} from GitHub'
                  )
                  print(f'Successfully uploaded {f}!')
          "
